plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'war'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
     // Webcam Capture API for QR scanning
    implementation 'com.github.sarxos:webcam-capture:0.3.12'

    // ZXing Library for QR Code Processing
    implementation 'com.google.zxing:core:3.4.1'
    implementation 'com.google.zxing:javase:3.4.1'

    // FlatLaf for Modern UI Design
    implementation 'com.formdev:flatlaf:3.2'

    // MySQL JDBC Driver
    implementation 'mysql:mysql-connector-java:8.0.33'

    // Servlet API (if using Java Servlets for backend)
    implementation 'javax.servlet:javax.servlet-api:4.0.1'
    implementation libs.guava
  
    implementation 'com.google.zxing:core:3.5.0'
    implementation 'com.google.zxing:javase:3.5.0'

    implementation 'org.jfree:jfreechart:1.5.3'
    
}
war {
    archiveFileName = 'attendance.war' // 👈 Name of the WAR file
}
task runQRGenerator(type: JavaExec) {
    mainClass = 'project.QrGenerator' // Ensure this is set correctly
    classpath = sourceSets.main.runtimeClasspath
}

application {
    // Define the main class for the application.
    mainClass = 'project.App' // This can remain as is if App is the main entry point
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
